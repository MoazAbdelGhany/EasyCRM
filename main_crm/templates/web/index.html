{% extends 'parts/base.html' %}
{% block content %}
<div class="text-center">
    <br><br><br>
    <h1>Django CRM ... Management at its best</h1>
    <h5><b>Efficiently manage your customer relationships with our powerful CRM system.</b></h5>
    <hr style="border: 1px solid #174d6c; margin: 30px 150px;">

    {% if user.is_authenticated %}
    <a href ="{% url 'dashboard' %}" class = "btn btn-primary btn-lg mt-3" >MY Dashboard</a>
    <a href="{% url 'create_record' %}" class="btn btn-primary btn-lg mt-3">Create New Record</a>
    <a href="{% url 'create_category' %}" class="btn btn-primary btn-lg mt-3">Create Category</a>
    {% else %}
    <a href ="{% url 'register' %}" class="btn btn-primary btn-lg active" role="button" aria-pressed="true">Register</a>
    {% endif %}

</div>



{% endblock %}
