
{% extends 'parts/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="container bg-dark shadow-md form-layout">
        <h1>Create your account</h1>
        <form method ="POST" autocomplete = "off">
            {% csrf_token %}
            {{ form|crispy }}
            <div><button type = "submit" class="btn btn-outline-primary">Register <i class="fa-regular fa-registered"></i></button></div>
            <br>
        </form>
    </div>
{% endblock %}
